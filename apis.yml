aid: contently
name: Contently
description: >-
  Contently is an end-to-end content marketing platform pairing enterprise content operations software
  with a vetted global network of freelance writers, editors, designers, and strategists. Brands use
  Contently to plan editorial calendars, source and manage creative talent, run review-and-approval
  workflows, publish across channels, and measure content performance. For developers Contently exposes
  the Talent API, a REST-first JSON API secured with scoped OAuth2 that lets teams search vetted
  creators, open NDA-scoped projects, brief and message contributors, submit draft reviews, approve and
  pay out work, and check funded balances. State-change webhooks (project assigned, draft submitted,
  review responded, payout released) fan out over Slack, Teams, or raw HTTP, and an official MCP server
  exposes the same surface to Claude, ChatGPT, and in-house agents. Contently maintains SOC 2 Type II,
  GDPR, CCPA, and HIPAA (BAA) posture with encrypted PII and NDA-scoped workspaces.
