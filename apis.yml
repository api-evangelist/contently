x-pointer-notes:
  removed_2026-08-13:
  - type: MCPServer
    reason: >-
      Removed. The pointer asserts the provider serves an MCP surface; Contently does not. It advertises
      six MCP tools on its product page but publishes no endpoint, install command, or package. The URL
      the prior round recorded (https://mcp.contently.com) is a wildcard DNS catch-all — it returns the
      byte-identical 302 as a bogus control subdomain. The artifact mcp/contently-mcp.yml is retained
      and records both the claim and its disproof. Do not re-add this pointer without a tools/list that
      actually answers.
  - type: StatusPage
    reason: >-
      Removed. status.contently.com serves the Contently application login SPA, not a status page, and
      https://contently.statuspage.io redirects to /inactive. See lifecycle/contently-lifecycle.yml.
  - type: DeveloperPortal
    reason: >-
      Removed. developer.contently.com 302s to /signin and returns the same 1,835-byte application login
      bundle as api.contently.com and status.contently.com. It is the product login, not a portal.
  - type: Pricing
    reason: >-
      Removed. https://contently.com/pricing 301s to the demo booking form; no pricing page exists. The
      absence is recorded in plans/contently-plans-pricing.yml with plan_count 0.
  - type: SignUp
    reason: >-
      Replaced with Login. app.contently.com is a wildcard catch-all redirecting to the apex; the real
      application entry point is https://contently.com/signin/, and it is a login, not a signup.
  withheld_2026-08-13:
  - type: WellKnown
    reason: All 32 /.well-known/ probes across four hosts returned 404. Probe recorded, no pointer.
  - type: AgentCard
    reason: No agent card at /.well-known/agent-card.json or /.well-known/agent.json on any host.
  - type: SDKs
    reason: >-
      packages/ holds one genuine first-party npm package, but it is a video.js editor plugin last
      released 2020-01-30, not a Talent API client. sdk_count is 0.
  - type: Idempotency
    reason: No idempotency header or retry contract is documented.
  - type: Deprecation
    reason: No deprecation policy or Sunset/Deprecation header contract is published.
