aid: contently
name: Contently
description: >-
  Contently is an end-to-end content marketing platform pairing enterprise content operations software
  with a vetted global network of 10,000+ freelance writers, editors, designers, and strategists,
  positioned for regulated industries such as financial services, healthcare, and insurance. Brands use
  Contently to plan editorial calendars, source and manage creative talent, run review-and-approval
  workflows with credentialed reviewers, publish across channels, and measure content performance. For
  developers Contently documents the Talent API, a REST-first JSON API secured with scoped OAuth2 that
  lets teams search vetted creators, open NDA-scoped projects, brief and message contributors, submit
  draft reviews, approve and pay out work, and check funded balances, with state-change webhooks over
  Slack, Teams, or raw HTTP. Contently also advertises an MCP server registering six tools, though no
  endpoint is published. No OpenAPI specification, reference documentation, or developer portal is
  published; API access is obtained through a sales conversation. Contently maintains SOC 2 Type II,
  GDPR, CCPA, HIPAA (BAA), and FINRA reviewer-pool posture with a published controls matrix.
