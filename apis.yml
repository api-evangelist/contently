  summary: >-
    Contently's Talent API is genuinely documented in prose on its product page and api.contently.com is
    a real configured host, but no machine-readable contract exists anywhere — 33 OpenAPI probes, 32
    well-known probes, GraphQL introspection, MCP tools/list and agent-card lookups all missed, and API
    access is sales-gated behind "Talk to our API team".
  openapi: none
  graphql: none
  asyncapi: none
  agent_card: none
  mcp: advertised-but-no-endpoint
  evidence:
  - url: https://contently.com/platform/talent-api/
    status: 200
  - url: https://api.contently.com/openapi.json
    status: 404
  - url: https://developer.contently.com/
    status: 302
  - url: https://mcp.contently.com/mcp
    status: 500
  - url: https://contently.com/.well-known/agent-card.json
    status: 404
  - url: https://contently.com/pricing
    status: 301
  wildcard_dns_warning: >-
    contently.com resolves ALL unknown subdomains — any label returns a 302 to the apex. Any future
    probe of a contently.com subdomain MUST be run against a bogus control label before its response is
    treated as evidence of a service.
