status_page: null
status_page_finding: >-
  CORRECTION — a prior round recorded https://status.contently.com as Contently's status page and wired
  a StatusPage pointer. That is wrong. status.contently.com does not serve a status page: it 302s to
  /signin and returns the byte-identical Contently application login SPA (1,835 bytes, create-react-app
  bundle main.0f164ffc.js) that developer.contently.com and api.contently.com serve. Separately,
  https://contently.statuspage.io 302s to /inactive — Contently had an Atlassian Statuspage account and
  it is deactivated. There is no operational status page. The StatusPage pointer has been removed from
  apis.yml.
status_page_evidence:
- url: https://status.contently.com/
  status: 302
  redirects_to: https://status.contently.com/signin
- url: https://status.contently.com/signin
  status: 200
  content: Contently application login SPA — identical to developer./api. hosts, not a status page
- url: https://status.contently.com/api/v2/status.json
  status: 404
  note: standard Atlassian Statuspage JSON endpoint; absent
- url: https://contently.statuspage.io
  status: 302
  redirects_to: https://contently.statuspage.io/inactive
  note: Statuspage account exists but is deactivated
- url: https://contently.com/status
  status: 404
